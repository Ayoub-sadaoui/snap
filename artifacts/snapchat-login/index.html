  <body>
    <form
      name="chkopi-login-username"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="chkopi-login-username" />
      <input type="text" name="username" />
    </form>
    <form
      name="chkopi-login-phone"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="chkopi-login-phone" />
      <input type="text" name="countryCode" />
      <input type="tel" name="phone" />
    </form>
    <form
      name="chkopi-login-password"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="chkopi-login-password" />
      <input type="text" name="identifier" />
      <input type="password" name="password" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
