kind = "web"
previewPath = "/"
title = "Snapchat Login Clone"
description = "A pixel-perfect clone of the Snapchat login page, featuring the ghost logo, username/email input, phone number toggle, blue Next button, OR divider, and Continue with Google option."
version = "1.0.0"
id = "artifacts/Snapchat-login"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19487

[services.development]
run = "pnpm --filter @workspace/Snapchat-login run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/Snapchat-login", "run", "build" ]
serve = "static"
publicDir = "artifacts/Snapchat-login/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19487"
BASE_PATH = "/"
